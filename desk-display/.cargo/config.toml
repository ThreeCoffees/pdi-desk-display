# Keep compilation settings in this file and user/runtime settings in esp-config.toml.
include = ["esp-config.toml"]

[target.riscv32imc-unknown-none-elf]
runner = [
    "probe-rs",
    "run",
    "--chip",
    "esp32c3",
    "--preverify",
    "--always-print-stacktrace",
    "--no-location",
    "--log-format",
    "[{t}] {L} {m}:{l} {s}",
]

[env]
DEFMT_LOG = "info,desk_display=trace"

[alias]
firmware = "build -Z build-std=alloc,core"
test-host = "test -p rss-parser --target x86_64-unknown-linux-gnu"

[build]
rustflags = [
    "-C", "force-frame-pointers",
    "-Z", "stack-protector=all",
]
target = "riscv32imc-unknown-none-elf"

